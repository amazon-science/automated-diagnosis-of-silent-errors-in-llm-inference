240>>9,240\n#### 9,240\n\nQuestion: Cara has 60 marbles in a bag. 20 of them are yellow, half as many are green, and the remaining marbles are equally divided between red and blue. If Cara picks a marble at random, what are the odds it's blue (expressed as a percentage)?\nAnswer: First find the number of green marbles: 20 yellow marbles / 2 = <<20/2=10>>10 green marbles\nThen find how many marbles are either red or blue: 60 marbles - 20 yellow marbles - 10 green marbles = <<60-20-10=30>>30 marbles\nDivide this number in half to find how many marbles are blue: 30 marbles / 2 = <<30/2=15>>15 blue marbles\nFinally, divide the number of blue marbles by the total number of marbles and multiply by 100 to find the percentage chance of getting a blue marble: 15 marbles / 60 marbles * 100 = <<15/60*100=25>>25%\n#### 25\n\nQuestion: Katherine has 5 hanging baskets to fill.  In each basket she wants to add 3 petunias and 2 sweet potato vines.  The petunias cost $3.00 apiece and the sweet potato vines cost $2.50 apiece.  How much will she spend filling all 5 hanging baskets?\nAnswer:"
