tudent must eat per school week to get a movie day?\nAnswer: The students need eat 100 vegetables in total because 200 / 2 = <<200/2=100>>100\nEach student needs to eat on average 4 vegetables because 100 / 25 = <<100/25=4>>4\nEach student needs to eat 2 vegetables per school week because 4 / 2 = <<4/2=2>>2\n#### 2\n\nQuestion: A plumber is trying to decide which of three different jobs he should take to make the most money.  The first job involves fixing three toilets and three sinks at an apartment complex.  The second involves two toilets and five sinks at a different apartment complex.  The third involves fixing one toilet, two showers and three sinks at a third apartment complex.  If the plumber charges $30 to fix a sink, $40 to fix a shower and $50 to fix a toilet, what is the most money the plumber can earn if he can only choose one of these three jobs?\nAnswer: If the plumber chooses the first job, he would earn 3*50 + 3*30 = $<<3*50+3*30=240>>240.\nIf he chooses the second, he'd earn 2*50 + 5*30 = $<<2*50+5*30=250>>250.\nIf he chooses the third, he'd earn 50 + 2*40 + 3*30 = $<<50+2*40+3*30=220>>220.\nTherefore, the most money he can earn from one of these jobs is $<<250=250>>250.\n#### 250\n\nQuestion: Ali is a dean of a private school where he teaches one class. John is also a dean of a public school. John has two classes in his school. Each class has 1/8 the capacity of Ali’s class which has the capacity of 120 students. What is the combined capacity of both schools?\nAnswer:"
    # - "Question: If John travels 15 miles on a bike ride, and Jill travels 5 miles less, how many miles does Jim travel if he travels only 20% as far as Jill?\nAnswer: To find how far Jim travels, we must first find out how far Jill did. To do this, we perform 15-5=<<15-5=10>>10 miles in total for Jill.\nWe then multiply 10*.20= 2 miles in total for Jim, since he only traveled 20% of the distance Jill did.\n#### 2\n\nQuestion: Chris has half as many cookies as Kenny. Glenn has four times as many cookies as Kenny. How many cookies do these three boys have, if Glenn has 24 cookies?\nAnswer: Kenny has 24/4 = <<24/4=6>>6 cookies.\nChris has 6/2 = <<6/2=3>>3 cookies.\nThese three boys have 24+6+3= <<24+6+3=33>>33 cookies.\n#### 33\n\nQuestion: A building has 20 floors. Each floor is 3 meters high, except for the last two floors. The last two floors are each 0.5 meters higher. How tall is the building?\nAnswer: There are 20 - 2 = <<20-2=18>>18 floors that are each 3 meters high.\nSo the first 18 floors is 18 x 3 = <<18*3=54>>54 meters high.\nThe last two floors are each 3 + 0.5 = <<3+0.5=3.5>>3.5 meters high.\nSo the total height of the last two floors is 3.5 x 2 = <<3.5*2=7>>7 meters.\nTherefore, the building is 54 + 7 = <<54+7=61>>61 meters high.\n#### 61\n\nQuestion: In Sam's collection, there are ten more black pens than blue pens and twice as many blue pens as pencils. There are also eight pencils and two fewer red pens than pencils. How many pens in all are there in Sam's collection?\nAnswer: 8 x 2 = <<8*2=16>>16 are blue pens.\n16 + 10 = <<16+10=26>>26 are black pens.\n8 - 2 = <<8-2=6>>6 are red pens.\nTherefore, there are 16 + 26 + 6 = <<16+26+6=48>>48 pens in all in Sam's collection.\n#### 48\n\nQuestion: A choir was singing a song that involved 30 singers. In the first verse, only half of them sang. In the second verse, a third of the remaining singers joined in. How many people joined in the final third verse that the whole choir sang together?\nAnswer: In the first verse, 30 / 2 = <<30/2=15>>15 singers sang.\nIn the second verse, 15 / 3 = <<15/3=5>>5 singers joined in.\nIn the final verse, 30 - 15 - 5 = <<30-15-5=10>>10 singers joined for the whole choir to sing together.\n#### 10\n\nQuestion: Carl buys ten packs of cookies. Each pack of cookies has six cookies inside. Each cookie cost $0.10. How much change does Carl receive if he pay with a $10 bill?\nAnswer:"
