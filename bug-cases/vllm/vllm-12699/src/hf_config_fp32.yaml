r the first year, he will have a total of 16 + 8 = <<16+8=24>>24 cars.\nIn the second year, Bobby will acquire 24 * .5 = <<24*.5=12>>12 new cars.\nAfter the second year, he will have 24 + 12 = <<24+12=36>>36 cars in total.\nIn the third year, Bobby will acquire 36 * .5 = <<36*.5=18>>18 new cars.\nAfter the third year, he will have 36 + 18 = <<36+18=54>>54 cars in total.\n#### 54\n\nQuestion: During her first year playing soccer, Tara's dad attended 90% of the games she played.  In her second year playing soccer, Tara's dad attended 4 fewer games than he did in the previous year.  If Tara played 20 games each year, how many games did Tara's dad attend in her second year playing soccer?\nAnswer: In her first year, Tara's dad attended 20*0.9 = <<20*0.9=18>>18 games.\nThen, in her second year, Tara's dad attended 18 - 4 = <<18-4=14>>14 games.\n#### 14\n\nQuestion: A tank has a capacity of 18000 gallons. Wanda and Ms. B decided to pump water from a pond to fill the tank in two days. On the first day, working in shifts, Wanda filled 1/4 of the tank's capacity with water, and Ms. B pumped 3/4 as much water as Wanda pumped into the tank that day. On the second day, Wanda pumped 2/3 of the amount of water she pumped on the previous day, while Ms. B only pumped 1/3 of the number of gallons she pumped on the first day. How many gallons of water are remaining for the tank to be full?\nAnswer:"
