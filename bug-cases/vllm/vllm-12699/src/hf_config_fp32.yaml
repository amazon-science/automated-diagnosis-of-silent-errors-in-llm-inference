27200>>27200 bees\nThe total number of bees in the hive including the queen is 27200+1 =<<27200+1=27201>>27201\n#### 27201\n\nQuestion: Lance wants to finish reading a 100 page book in 3 days. Yesterday, he started to read 35 pages. Today, he read 5 fewer pages than yesterday. How many pages should he read tomorrow to finish the book?\nAnswer: Lance read 35 - 5 = <<35-5=30>>30 pages today.\nSo he read a total of 35 + 30 = <<35+30=65>>65 pages in 2 days.\nThus, he should read 100 - 65 = <<100-65=35>>35 pages tomorrow.\n#### 35\n\nQuestion: Shawnda decides that her neighborhood kids could really use a bike inflation service. She decides the best way to charge is by the tire. Each tire costs 25 cents to inflate. On the first day, 5 people on bicycles came by to get both tires inflated. 3 people came by to get all their tricycle tires inflated. Finally, one person actually came by on a unicycle. How many dollars did she make that day?\nAnswer:"
