oda.\nThus, the total amount section Einstein collected was $180 + $12 +$50 = $<<180+12+50=242>>242.\nTherefore, Einstein needs $500 - $242 = $<<500-242=258>>258 more to reach the goal.\n#### 258\n\nQuestion: Gretchen draws caricatures in the park on the weekends.  She charges $20.00 per drawing.  If she sold 24 on Saturday and 16 on Sunday, how much money did she make?\nAnswer: She drew 24 on Saturday and 16 on Sunday for a total of 24+16 = <<24+16=40>>40 drawings\nShe charges $20.00 per drawing and she drew 40 caricatures so she made $20*40 = $<<20*40=800>>800\n#### 800\n\nQuestion: Joe's bag of Halloween candy has 25 chocolate bars and 80 candied apples. Each chocolate bar weighs twice as much as each candied apple. If each chocolate bar weighs 40g, how much does Joe's bag of candy weigh, in grams?\nAnswer:"
