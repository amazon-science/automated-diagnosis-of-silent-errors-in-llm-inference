    # - "Question: Jen and Tyler are gymnasts practicing flips. Jen is practicing the triple-flip while Tyler is practicing the double-flip. Jen did sixteen triple-flips during practice. Tyler flipped in the air half the number of times Jen did. How many double-flips did Tyler do?\nAnswer: Jen did 16 triple-flips, so she did 16 * 3 = <<16*3=48>>48 flips.\nTyler did half the number of flips, so he did 48 / 2 = <<48/2=24>>24 flips.\nA double flip has two flips, so Tyler did 24 / 2 = <<24/2=12>>12 double-flips.\n#### 12\n\nQuestion: Four people in a law firm are planning a party. Mary will buy a platter of pasta for $20 and a loaf of bread for $2. Elle and Andrea will split the cost for buying 4 cans of soda which cost $1.50 each, and chicken wings for $10. Joe will buy a cake that costs $5. How much more will Mary spend than the rest of the firm put together?\nAnswer: Mary will spend $20 + $2 = $<<20+2=22>>22.\nElle and Andrea will spend $1.5 x 4 = $<<1.5*4=6>>6 for the soda.\nElle and Andrea will spend $6 + $10 = $<<6+10=16>>16 for the soda and chicken wings.\nElle, Andrea, and Joe together will spend $16 + $5 = $<<16+5=21>>21.\nSo, Mary will spend $22 - $21 = $<<22-21=1>>1 more than all of them combined.\n#### 1\n\nQuestion: A charcoal grill burns fifteen coals to ash every twenty minutes of grilling. The grill ran for long enough to burn three bags of coals. Each bag of coal contains 60 coals. How long did the grill run?\nAnswer: The grill burned 3 * 60 = <<3*60=180>>180 coals.\nIt takes 20 minutes to burn 15 coals, so the grill ran for 180 / 15 * 20 = <<180/15*20=240>>240 minutes.\n#### 240\n\nQuestion: A bear is preparing to hibernate for the winter and needs to gain 1000 pounds. At the end of summer, the bear feasts on berries and small woodland animals. During autumn, it devours acorns and salmon. It gained a fifth of the weight it needed from berries during summer, and during autumn, it gained twice that amount from acorns. Salmon made up half of the remaining weight it had needed to gain. How many pounds did it gain eating small animals?\nAnswer: The bear gained 1 / 5 * 1000 = <<1/5*1000=200>>200 pounds from berries.\nIt gained 2 * 200 = <<2*200=400>>400 pounds from acorns.\nIt still needed 1000 - 200 - 400 = <<1000-200-400=400>>400 pounds.\nThus, it gained 400 / 2 = <<400/2=200>>200 pounds from salmon.\nTherefore, the bear gained 400 - 200 = <<400-200=200>>200 pounds from small animals.\n#### 200\n\nQuestion: Brendan can cut 8 yards of grass per day, he bought a lawnmower and it helped him to cut more yards by Fifty percent per day. How many yards will Brendan be able to cut after a week?\nAnswer: The additional yard Brendan can cut after buying the lawnmower is 8 x 0.50 = <<8*0.50=4>>4 yards.\nSo, the total yards he can cut with the lawnmower is 8 + 4 = <<8+4=12>>12.\nTherefore, the total number of yards he can cut in a week is 12 x 7 = <<12*7=84>>84 yards.\n#### 84\n\nQuestion: Rory orders 2 subs for $7.50 each, 2 bags of chips for $1.50 each and 2 cookies for $1.00 each for delivery.  There’s a 20% delivery fee added at check out and she wants to add a $5.00 tip.  What will her delivery order cost?\nAnswer:"
    # - "Question: There is a very large room that has 4 tables, 1 sofa and 2 chairs that have 4 legs each.  There are also 3 tables with 3 legs each, 1 table with 1 leg, and 1 rocking chair with 2 legs.  How many legs are there in the room?\nAnswer: There are 4 tables, 1 sofa and 2 chairs that have 4 legs each so 4+1+2 =<<4+1+2=7>>7 pieces of furniture\nThese 7 pieces have 4 legs each so they have 7*4 = <<7*4=28>>28 legs\nThere are 3 tables with 3 legs each so they have 3*3 = <<3*3=9>>9 legs\nWe have 28 legs and 9 legs as well a 1 leg on a table and 2 on a rocking chair for a total of 28+9+1+2 = <<28+9+1+2=40>>40 legs\n#### 40\n\nQuestion: Lilith is trying to break the world record for largest cap collection. She collects 3 caps per month in the first year, and 5 caps per month after the first year. Each Christmas, she also receives 40 caps from friends and family. She estimates that each year, she loses 15 of the caps she has collected. If Lilith has been collecting for 5 years, how many caps has she collected so far?\nAnswer: In the first year, Lilith collects 3 caps * 12 months = <<3*12=36>>36 caps.\nEvery year afterwards, she collects 5 caps * 12 months = <<5*12=60>>60 caps.\nShe does this for a total of 5 – 1 = <<5-1=4>>4 years.\nThis is a total of 60 caps * 4 years = <<60*4=240>>240 caps.\nIn total, she collects 36 + 240 = <<36+240=276>>276 caps by herself.\nOver the Christmases, she receives 40 caps * 5 years = <<40*5=200>>200 caps from friends and family.\nShe also loses 15 caps * 5 years = <<15*5=75>>75 caps over the years.\nShe has therefore collected 276 + 200 – 75 = <<276+200-75=401>>401 caps.\n#### 401\n\nQuestion: A water tower that serves four neighborhoods around it holds 1200 barrels of water and is filled to the top each week. If one neighborhood uses 150 barrels of water in a week, the second neighborhood uses twice as many barrels of water as the first neighborhood in a week, and the third neighborhood uses one hundred more barrels of water than the second neighborhood in a week, how many barrels are left for the fourth neighborhood?\nAnswer: The second neighborhood uses 150 * 2 = <<150*2=300>>300 barrels of water.\nThe third neighborhood uses 300 + 100 = <<300+100=400>>400 barrels of water.\nThe first, second, and third neighborhoods together use 150 + 300 + 400 = <<150+300+400=850>>850 barrels of water.\nThus, the fourth neighborhood has 1200 - 850 = <<1200-850=350>>350 barrels of water left for it to use.\n#### 350\n\nQuestion: Mia can decorate 2 dozen Easter eggs per hour. Her little brother Billy can only decorate 10 eggs per hour. They need to decorate 170 eggs for the Easter egg hunt. If they work together, how long will it take them to decorate all the eggs?\nAnswer: Working together, they can decorate 24 + 10 = <<24+10=34>>34 eggs per hour.\nIt will take them 170 / 34 = <<170/34=5>>5 hours to decorate all of the eggs.\n#### 5\n\nQuestion: Brandon has been fired from half the businesses in town and has quit from a third of them. If there are 72 business in town, how many businesses can he still apply to?\nAnswer: First divide the total number of businesses by 2 to find how many businesses Brandon hasn't been fired from: 72 businesses / 2 = <<72/2=36>>36 businesses\nThen divide the total number of businesses by 3 to find how many businesses Brandon quit from: 72 businesses / 3 = <<72/3=24>>24 businesses\nThen subtract that number from the number of businesses he hasn't been fired from to find the number of businesses where he can still apply: 36 businesses - 24 businesses = <<36-24=12>>12 businesses\n#### 12\n\nQuestion: Mr. Smith has two farms, Farm X and Farm Y. He has 55 goats in Farm X and 45 goats in Farm Y. He sold 10 goats from Farm X and twice as many goats from Farm Y. How many goats are left in the two farms altogether?\nAnswer:"
