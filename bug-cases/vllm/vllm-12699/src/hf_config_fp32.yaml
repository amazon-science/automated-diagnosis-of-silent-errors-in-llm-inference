.\nTherefore, Emmy and Gerry can buy $300/$2 = <<300/2=150>>150 apples altogether.\n#### 150\n\nQuestion: Bobby needs to buy a new pair of fancy shoes.  He decides to go to a cobbler and get them handmade.  The cobbler charges $250 to make the mold.  He then charges $75 an hour for 8 hours to make the shoes.  The cobbler agrees to only charge 80% of the cost for work to make the shoes, since it is his first pair of shoes.  How much did Bobby pay?\nAnswer: The cost of labor is 75*8=$<<75*8=600>>600\nSo Bobby pays 600*.8=$<<600*.8=480>>480\nSo that means Bobby pays 480+250=$<<480+250=730>>730\n#### 730\n\nQuestion: Janet needs 5 tickets to ride the roller coaster and 3 tickets to ride the giant slide. How many tickets does she need to ride the roller coaster 7 times and the giant slide 4 times?\nAnswer: First find how many tickets she needs for the roller coaster: 5 tickets/ride * 7 rides = <<5*7=35>>35 tickets\nThen find how many tickets she needs for the giant slide: 3 tickets/ride * 4 rides = <<3*4=12>>12 tickets\nThen add the number of tickets she needs for each ride to find the total number of tickets she needs: 12 tickets + 35 tickets = <<12+35=47>>47 tickets\n#### 47\n\nQuestion: Carly is making cupcakes and brownies for her art class. She makes 2 less than three times as many brownies as cupcakes. If Carly's class has five people and each person gets two treats, how many cupcakes did Carly make?\nAnswer:"
