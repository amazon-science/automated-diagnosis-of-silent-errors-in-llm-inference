How many oranges are left to be sold today?\nAnswer: Mr. Salazar had 7 x 12 = <<7*12=84>>84 oranges.\nHe reserved 84 x 1/4 = <<84*1/4=21>>21 oranges for his friend.\nHa had 84 - 21 = <<84-21=63>>63 oranges to be sold yesterday.\nBut only 63 x 3/7 = <<63*3/7=27>>27 oranges were sold yesterday.\nSo, he had 63 - 27 = <<63-27=36>>36 oranges left.\nSince four oranges are rotten, then only 36 - 4 = <<36-4=32>>32 oranges are left to be sold today.\n#### 32\n\nQuestion: Nina has two pairs of shoes. She bought one of them for $22, and the second one was 50% more expensive. How much did Nina pay for both pairs of shoes?\nAnswer: The second pair of shoes was 50/100 * 22 = $<<50/100*22=11>>11 more expensive.\nThat means that the second pair's price was 22 + 11 = $<<22+11=33>>33.\nSo for both pairs of shoes, Nina paid 33 + 22 = $<<33+22=55>>55.\n#### 55\n\nQuestion: Anna is trying to buy books for her local library. She had a budget of $16, and she has already spent $4. She also bought 2 books today, and both books cost her the same amount of money. If Anna has $2 left in her budget, how much did each of the books cost?\nAnswer:"
    # - "Question: If a basket is capable of holding 40 fruit altogether, and there are 3 times as many apples as oranges, how many oranges are there?\nAnswer: Since the ratio of apples to oranges is 3:1, that means for every 3 apples there is 1 orange. The size of this group is therefore 3+1=<<3+1=4>>4.\nWe then divide this group size into the total amount of fruit the basket is holding at this time, which is 40. This means there are 40/4=<<40/4=10>>10 of these groups in total.\nSince there are 10 of these groups in total, that means there are 10*1=<<10*1=10>>10 oranges in the basket.\n#### 10\n\nQuestion: Agnes is 25 years old and her daughter, Jane is 6 years old. In how many years will Agnes be twice as old as Jane?\nAnswer: Let the number of years after which Agnes will be twice as old as Jane be x\nAfter x years, 25+x = 2(6+x)\nSolving the equation by expanding and collecting like terms gives: x-2x = 12-25\nFurther solving gives: -x = -13\nMultiplying both sides by -1 gives x = 13\n#### 13\n\nQuestion: Michael buys his suit for $430 and shoes for $190. So, if he gets a $100 discount, what was the amount that he paid to the seller?\nAnswer: The amount before the deduction is $430 + $190 = $<<430+190=620>>620.\nThe amount paid to the seller after the discount is $620 - $100 = $<<620-100=520>>520.\n#### 520\n\nQuestion: Jill runs a business breeding llamas. Nine of her llamas got pregnant with 1 calf, and 5 of them got pregnant with twins. After they give birth, Jill traded 8 of the calves for 2 new adult llamas. Then she sells 1/3 of her herd at the market. How many total llamas  (calves and adults) does Jill have now?\nAnswer: The number of calves that will be born as twins is 5 * 2 = <<5*2=10>>10 calves.\nThe total number of adults and calves before the trade is 9 + 5 + 9 + 10 = <<9+5+9+10=33>>33.\nJill had 33 - 8 = <<33-8=25>>25 left for trading 8 of the claves.\nBut, she got 2 adult llamas in return, so she now has a total of 25 + 2 = <<25+2=27>>27 llamas.\nShe then sold 27 / 3 = <<27/3=9>>9 llamas in the market.\nSo, Jill has 27 - 9 = <<27-9=18>>18 llamas now.\n#### 18\n\nQuestion: Léa bought one book for $16, three binders for $2 and six notebooks for $1. Calculate the total cost of her purchases.\nAnswer: The binders cost 3 binders * $2/binder = $<<3*2=6>>6\nThe notebooks cost 6 notebooks * $1/notebook = $<<6*1=6>>6\nThe amount of Lea’s purchases is: $16 + $6 + $6 = $<<16+6+6=28>>28\n#### 28\n\nQuestion: Michael is replacing the carpet in his bedroom.  The new carpet he's chosen costs $12 per square foot, plus $2 per square foot for padding underneath.  His contractor charges $4 per square foot to remove the old carpet, and $34 per square foot to install the new carpet.  His bedroom measures 18 feet by 12 feet.  How much will it cost Michael to replace the carpet?\nAnswer:"
    # - "Question: The price of electricity went up by 25%.  John's old computer used 800 watts and his new computer uses 50% more.  If the old price of electricity was 12 cents per kilowatt-hour, how much does his computer cost, in dollars, to run for 50 hours?\nAnswer: His new computer uses 800*.5=<<800*.5=400>>400 watts more than his old computer\nSo it users 800+400=<<800+400=1200>>1200 watts\nThat is 1200/1000=<<1200/1000=1.2>>1.2 kw\nElectricity cost 12*.25=<<12*.25=3>>3 cents more than it used to\nSo it now cost 12+3=<<12+3=15>>15 cents per kwh\nHe used 1.2*50=<<1.2*50=60>>60 kwh\nSo he paid 15*60=<<900=900>>900 cents per kwh\nSo he paid 900/100=$<<900/100=9>>9\n#### 9\n\nQuestion: Hilary is shucking corn from ears that grew on her farm. She gets four ears of corn per stalk, and she has 108 stalks growing. Half the ears of corn have 500 kernels of corn and the other half have 100 more. How many kernels of corn does Hilary have to shuck?\nAnswer: She has 108 * 4 = <<108*4=432>>432 ears of corn to shuck.\nShe gets 500 kernels of corn from half the ears and 500 + 100 = <<500+100=600>>600 kernels from the other half.\nHalf the number of ears of corn is 432 / 2 = <<432/2=216>>216 ears.\nThus, Hilary has 216 * 500 + 216 * 600 = 108000 + 129600 = <<216*500+216*600=237600>>237600 kernels to shuck.\n#### 237600\n\nQuestion: John and his best friend Steve bought 12 cupcakes together.  Each cupcake cost $1.50. If they split the costs evenly, how much did each person pay?\nAnswer: The total cost of cupcakes was 1.5*12=$<<1.5*12=18>>18\nSo they each paid 18/2=$<<18/2=9>>9\n#### 9\n\nQuestion: Jesse is playing with a pile of building blocks. He first builds a building with 80 building blocks. Then he builds a farmhouse with 123 building blocks. He adds a fenced-in area next to the farm made of 57 building blocks. If Jesse has 84 building blocks left, how many building blocks did he start with?\nAnswer: Jesse built three structures out of building blocks, 80 + 123 + 57 = <<80+123+57=260>>260 building blocks.\nJesse started with 260 + 84 leftover building blocks = <<260+84=344>>344 building blocks that Jesse had originally.\n#### 344\n\nQuestion: Josh’s mom gives him $20 to go shopping at the mall. He buys a hat for $10 and a pencil for $2. Then he buys four cookies. If each cookie costs $1.25, how much money does Josh have left?\nAnswer: After buying a hat, Josh has $20 - $10 = $<<20-10=10>>10\nAfter buying a pencil, Josh has $10 - $2 = $<<10-2=8>>8\nThe total cost of cookies is 4 * $1.25 = $<<4*1.25=5>>5\nAfter buying the cookies, Josh has $8 - $5 = $<<8-5=3>>3\n#### 3\n\nQuestion: Sandra's neighbor gives her a basket of 9 eggs every time she babysits their daughter. To make a Spanish flan, she needs 3 eggs. If Sandra has been tasked to make 15 Spanish flans for her school fundraiser, how many times does Sandra have to babysit?\nAnswer:"
