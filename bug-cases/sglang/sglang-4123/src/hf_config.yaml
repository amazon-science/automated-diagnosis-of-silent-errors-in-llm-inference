output_path: "${EKKA_ROOT}/bug-cases/sglang/sglang-4123/driver_output"
mode: qwen2_5_vl

env:
  CUDA_VISIBLE_DEVICES: "0"
seed: 1234

# top-level vision knobs (optional)
# vision:
#   min_pixels: 200704      # 256 * 28 * 28
#   max_pixels: 1003520     # 1280 * 28 * 28

model:
  name: "Qwen/Qwen2.5-VL-7B-Instruct"
  torch_dtype: "bfloat16"
  tp_plan: "auto"

prompt:
  messages:
    - role: "user"
      content:
        - type: "image"
          image: "${EKKA_ROOT}/bug-cases/sglang/sglang-4123/src/street.jpg"
        # - type: "image"
        #   image: "${EKKA_ROOT}/bug-cases/sglang/sglang-4123/src/kitchen.jpg"
        - type: "text"
          text: "Describe this image"

generation:
  max_new_tokens: 512
  do_sample: false
